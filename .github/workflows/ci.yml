name: CI

on:
  push:
    branches: [ 'main', 'custodian/**' ]
  pull_request:
    branches: [ 'main', 'custodian/**' ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Prepare static directory for embed
        run: |
          mkdir -p app/static
          touch app/static/.gitkeep

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Backend Tests
        run: go test -v -race ./...

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: |
          cd frontend
          pnpm run test --passWithNoTests

      - name: Build Frontend
        run: |
          cd frontend
          pnpm run build
